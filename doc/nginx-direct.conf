# ============================================================
# na 单体平台 Nginx 配置（直连 na-upms:10061）
# ------------------------------------------------------------
# 链路：
#   浏览器 → Nginx → na-upms:10061
#
# URL 规范：
#   /api/na-upms/**  → na-upms（原样透传）
#   /na-upms/ws      → na-upms 的 /ws（剥离 /na-upms 前缀）
#   /na-upms/video/** → na-upms 的 /video/**（本地文件静态映射）
# ============================================================

# WebSocket：有 Upgrade 头时转发 upgrade，否则关闭
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 访问日志脱敏：WebSocket 的 token 在 query 里，含 token= 的请求不写日志
map $request_uri $loggable {
    ~token= 0;
    default 1;
}

upstream na_upms {
    server 127.0.0.1:10061;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com;

    # 前端构建产物目录（web/dist 的内容）
    root /data/www/na-web;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 后端 multipart 上限为 100GB，Nginx 默认 1MB 会直接返回 413
    client_max_body_size 100g;
    client_body_timeout 300s;

    # ---------------- gzip ----------------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xhtml+xml image/svg+xml;
    gzip_vary on;

    # 含 token 的请求不落访问日志
    access_log /var/log/nginx/na.access.log combined if=$loggable;
    error_log  /var/log/nginx/na.error.log warn;

    # ========================================================
    # 1. 前端静态资源（Vue Router history 模式）
    # ========================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ========================================================
    # 2. 业务接口：原样透传到 na-upms
    # ========================================================
    location /api/na-upms/ {
        proxy_pass http://na_upms;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # ========================================================
    # 3. WebSocket 与本地文件：剥离 /na-upms 前缀
    # --------------------------------------------------------
    # /na-upms/ws        → /ws
    # /na-upms/video/**  → /video/**
    # ========================================================
    location /na-upms/ {
        rewrite ^/na-upms(/.*)$ $1 break;

        proxy_pass http://na_upms;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ========================================================
    # 4. 监控 / 接口文档仅内网访问（可选）
    # ========================================================
    # location ~ ^/(druid|doc\.html|webjars|v3/api-docs|swagger-ui) {
    #     allow 192.168.0.0/16;
    #     allow 127.0.0.1;
    #     deny all;
    #
    #     proxy_pass http://na_upms;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    # }
}
